name: WordPress theme security validation

on:
  push:
    branches:
      - agent/security-build-repair
    paths:
      - package.json
      - gulpfile.js
      - .github/workflows/security-build-repair.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-build-repair
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate v1 lockfile
        id: lock
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts --lockfile-version=1

      - name: Clean install
        id: install
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Build theme assets
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .security-build.log

      - name: Audit locked tree
        if: steps.install.outcome == 'success'
        run: npm audit --json > .security-audit.json || true

      - name: Summarize audit
        if: steps.install.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.security-audit.json', 'utf8'));
          const wanted = new Set(['critical', 'high', 'moderate']);
          const findings = Object.entries(report.vulnerabilities || {})
            .filter(([, value]) => wanted.has(value.severity))
            .map(([name, value]) => ({name, severity: value.severity, direct: Boolean(value.isDirect), range: value.range, via: (value.via || []).map(item => typeof item === 'string' ? item : item.title), fixAvailable: value.fixAvailable}));
          fs.writeFileSync('.security-audit-summary.json', JSON.stringify({counts: report.metadata && report.metadata.vulnerabilities || {}, findings}, null, 2) + '\n');
          NODE

      - name: Commit build-validated lockfile
        if: steps.lock.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile for security update"
            git push origin HEAD:agent/security-build-repair
          fi

      - name: Record validation
        if: always()
        run: |
          printf 'lock=%s\ninstall=%s\nbuild=%s\n' "${{ steps.lock.outcome }}" "${{ steps.install.outcome }}" "${{ steps.build.outcome }}" > .security-validation-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-validation-status.txt
          for file in .security-build.log .security-audit-summary.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record WordPress theme security diagnostics"
            git push origin HEAD:agent/security-build-repair
          fi

      - name: Fail when install or build did not pass
        if: always() && (steps.lock.outcome != 'success' || steps.install.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
