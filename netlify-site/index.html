<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ronal Chhetri portfolio website">
  <title>Ronal Chhetri</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #243b53 0, #102a43 42%, #06111f 100%); color: #f7fafc; }
    main { width: min(720px, 100%); padding: clamp(32px, 7vw, 72px); border: 1px solid rgba(255,255,255,.16); border-radius: 28px; background: rgba(7, 21, 38, .72); box-shadow: 0 24px 80px rgba(0,0,0,.38); backdrop-filter: blur(14px); }
    p { margin: 0 0 14px; color: #cbd5e0; font-size: clamp(16px, 2.5vw, 20px); line-height: 1.65; }
    .eyebrow { color: #63b3ed; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 16px 0 18px; font-size: clamp(48px, 11vw, 92px); line-height: .95; letter-spacing: -.055em; }
    .status { display: inline-flex; gap: 10px; align-items: center; margin-top: 24px; padding: 10px 14px; border-radius: 999px; background: rgba(72,187,120,.12); color: #9ae6b4; font-size: 14px; }
    .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #48bb78; box-shadow: 0 0 18px #48bb78; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Portfolio</p>
    <h1>Ronal Chhetri</h1>
    <p>This static landing page keeps the website available while the original WordPress theme remains maintained separately.</p>
    <p class="status">Netlify deployment configured</p>
  </main>
</body>
</html>
