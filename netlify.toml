[build]
  base = "workspace/portfolio"
  command = "sh build.sh"
  publish = "dist"
  ignore = "if [ \"${CONTEXT:-}\" != \"production\" ] || [ \"${PULL_REQUEST:-false}\" = \"true\" ] || [ \"${BRANCH:-}\" != \"master\" ]; then exit 0; fi; subject=\"$(git log -1 --pretty=%s \"${COMMIT_REF:-}\" 2>/dev/null)\" || exit 0; case \"$subject\" in *\"[deploy]\") exit 1 ;; *) exit 0 ;; esac"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

[[redirects]]
  from = "/resume.html"
  to = "/resume"
  status = 301
  force = true

[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 200

[[redirects]]
  from = "/legacy.html"
  to = "/legacy"
  status = 301
  force = true

[[redirects]]
  from = "/legacy"
  to = "/legacy.html"
  status = 200

[[redirects]]
  from = "/linkedin"
  to = "https://www.linkedin.com/in/ronal-chhetri/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/legacy"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/legacy.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
